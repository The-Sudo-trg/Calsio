services:
  postgres:
    image: postgres:16-alpine
    container_name: calsio-postgres
    environment:
      POSTGRES_USER: calsio
      POSTGRES_PASSWORD: calsio_dev
      POSTGRES_DB: calsio
    ports:
      - "5432:5432"
    volumes:
      - calsio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calsio -d calsio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  calsio_pgdata:
